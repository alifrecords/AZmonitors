# Monitor Match — Windows (VST3) va macOS (VST3 + AU, universal) uchun avtomatik yig'ish.
name: Build Monitor Match

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-14
            name: macOS
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log || {
            grep -iE "error" -A3 configure.log | head -30 | sed 's/^/::error::/'
            exit 1
          }

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 4 2>&1 | tee build.log || {
            grep -E "error|Error|FAILED|undefined" build.log | grep -v "warning" | head -40 | sed 's/^/::error::/'
            exit 1
          }

      - name: pluginval (strictness 10)
        shell: bash
        run: |
          VST3=$(find build -name "Monitor Match.vst3" -type d | head -1)
          if [ "$RUNNER_OS" == "Windows" ]; then
            curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
            unzip -q pv.zip && ./pluginval.exe --strictness-level 10 --validate-in-process --validate "$VST3"
          else
            curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
            unzip -q pv.zip && ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --validate "$VST3"
          fi

      - name: auval (Logic Pro uchun AU tekshiruvi)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/MonitorMatch_artefacts/Release/AU/Monitor Match.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx MnMt Azmx

      - name: Paketlash
        shell: bash
        run: |
          OUT="MonitorMatch-${{ matrix.name }}"
          mkdir -p "$OUT"
          cp -R build/MonitorMatch_artefacts/Release/VST3/*.vst3 "$OUT/"
          [ -d build/MonitorMatch_artefacts/Release/AU ] && cp -R build/MonitorMatch_artefacts/Release/AU/*.component "$OUT/"
          if [ "$RUNNER_OS" == "macOS" ]; then
            for b in "$OUT"/*.vst3 "$OUT"/*.component; do codesign --force --deep --sign - "$b"; done
          fi
          cp README.md "$OUT/"

      - uses: actions/upload-artifact@v4
        with:
          name: MonitorMatch-${{ matrix.name }}
          path: MonitorMatch-${{ matrix.name }}
